
name: ProjectX CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and Package
    runs-on: [self-hosted, Windows, X64, iis, dev]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate project
        id: project
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $projects = @(Get-ChildItem $env:GITHUB_WORKSPACE -Filter "*.csproj" -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })

          if ($projects.Count -ne 1) {
            throw "Expected exactly one .csproj for this POC; found $($projects.Count)."
          }

          "PROJECT_PATH=$($projects[0].FullName)" >> $env:GITHUB_ENV
          "PROJECT_NAME=$([IO.Path]::GetFileNameWithoutExtension($projects[0].Name))" >> $env:GITHUB_ENV

      - name: Restore
        shell: powershell
        run: |
          dotnet restore "$env:PROJECT_PATH"
          if ($LASTEXITCODE -ne 0) { throw "Restore failed." }

      - name: Build
        shell: powershell
        run: |
          dotnet build "$env:PROJECT_PATH" --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      - name: Run tests if present
        shell: powershell
        run: |
          $tests = @(Get-ChildItem $env:GITHUB_WORKSPACE -Filter "*Tests.csproj" -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })
          $tests += @(Get-ChildItem $env:GITHUB_WORKSPACE -Filter "*Test.csproj" -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' })
          $tests = @($tests | Sort-Object FullName -Unique)

          foreach ($test in $tests) {
            dotnet test "$($test.FullName)" --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $($test.FullName)" }
          }

          if ($tests.Count -eq 0) { Write-Host "No test projects found; skipping tests." }

      - name: Publish application
        shell: powershell
        run: |
          $publish = Join-Path $env:RUNNER_TEMP "ProjectX-publish"
          if (Test-Path $publish) { Remove-Item $publish -Recurse -Force }

          dotnet publish "$env:PROJECT_PATH" `
            --configuration Release `
            --no-build `
            --output "$publish"

          if ($LASTEXITCODE -ne 0) { throw "Publish failed." }

          if (-not (Test-Path (Join-Path $publish "web.config"))) {
            throw "Published web.config missing. Check ASP.NET Core Web SDK and publish output."
          }

          if (-not (Test-Path (Join-Path $publish "$env:PROJECT_NAME.dll"))) {
            throw "Published application DLL missing."
          }

      - name: Create deployment ZIP
        shell: powershell
        run: |
          $publish = Join-Path $env:RUNNER_TEMP "ProjectX-publish"
          $zip = Join-Path $env:RUNNER_TEMP "ProjectX.zip"

          if (Test-Path $zip) { Remove-Item $zip -Force }

          Compress-Archive -Path "$publish\*" -DestinationPath $zip -Force

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectX-${{ github.sha }}
          path: ${{ runner.temp }}\ProjectX.zip
          if-no-files-found: error
          retention-days: 14
