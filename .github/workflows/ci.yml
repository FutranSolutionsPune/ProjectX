
name: ProjectX CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "epic/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test and Package
    runs-on: [self-hosted, Windows, X64, iis, dev]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Locate application project
        shell: powershell
        run: |
          $projects = @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.csproj -Recurse |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]' -and
                $_.Name -notmatch 'Tests?\.csproj$'
              }
          )

          if ($projects.Count -ne 1) {
            throw "Expected exactly one application .csproj; found $($projects.Count)."
          }

          "PROJECT_PATH=$($projects[0].FullName)" >> $env:GITHUB_ENV
          "PROJECT_NAME=$([System.IO.Path]::GetFileNameWithoutExtension($projects[0].Name))" >> $env:GITHUB_ENV

      - name: Restore
        shell: powershell
        run: dotnet restore "$env:PROJECT_PATH"

      - name: Build
        shell: powershell
        run: dotnet build "$env:PROJECT_PATH" --configuration Release --no-restore

      - name: Run tests
        shell: powershell
        run: |
          $tests = @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.csproj -Recurse |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]' -and
                $_.Name -match 'Tests?\.csproj$'
              }
          )

          if ($tests.Count -eq 0) {
            Write-Host "No test project found. Test execution skipped."
          } else {
            foreach ($test in $tests) {
              dotnet test "$($test.FullName)" --configuration Release
              if ($LASTEXITCODE -ne 0) {
                throw "Tests failed: $($test.Name)"
              }
            }
          }

      - name: Publish application
        shell: powershell
        run: |
          $publish = Join-Path $env:RUNNER_TEMP "ProjectX-publish"
          if (Test-Path $publish) {
            Remove-Item $publish -Recurse -Force
          }

          dotnet publish "$env:PROJECT_PATH" `
            --configuration Release `
            --no-build `
            --output $publish

          if (!(Test-Path (Join-Path $publish "web.config"))) {
            throw "Publish output is missing web.config."
          }

          if (!(Test-Path (Join-Path $publish "$env:PROJECT_NAME.dll"))) {
            throw "Publish output is missing $env:PROJECT_NAME.dll."
          }

          "PUBLISH_DIR=$publish" >> $env:GITHUB_ENV

      - name: Create deployment package
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ProjectX.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$env:PUBLISH_DIR\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectX-${{ github.sha }}
          path: ${{ runner.temp }}\ProjectX.zip
          if-no-files-found: error
          retention-days: 14

  deploy-dev:
    name: Deploy to DEV
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/dev-cd.yml
    permissions:
      actions: read
      contents: read

  deploy-qa2:
    name: Deploy epic to QA2
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/epic/')
    uses: ./.github/workflows/qa2-cd.yml

  deploy-qa1:
    name: Deploy to QA1
    needs: [build, deploy-dev]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, Windows, X64, iis, dev]
    environment: QA1

    steps:
      - name: Download artifact from this CI run
        uses: actions/download-artifact@v4
        with:
          name: ProjectX-${{ github.sha }}
          path: ${{ runner.temp }}\qa1-package

      - name: Validate QA1 package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $package = Join-Path $env:RUNNER_TEMP "qa1-package"
          $zip = Join-Path $package "ProjectX.zip"

          if (!(Test-Path $zip)) {
            throw "ProjectX.zip was not found in the CI artifact."
          }

          $publish = Join-Path $package "publish"
          if (Test-Path $publish) {
            Remove-Item $publish -Recurse -Force
          }

          New-Item -ItemType Directory -Path $publish -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $publish -Force

          if (!(Test-Path (Join-Path $publish "web.config"))) {
            throw "Package is missing web.config."
          }

          if (!(Get-ChildItem $publish -Filter "*.dll" -File)) {
            throw "Package contains no application DLL."
          }

      - name: Deploy to QA1 IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module WebAdministration

          $site = "ProjectX-QA1"
          $pool = "ProjectX-QA1"
          $target = "C:\inetpub\wwwroot\ProjectX-QA1"
          $publish = Join-Path $env:RUNNER_TEMP "qa1-package\publish"
          $backup = Join-Path $env:RUNNER_TEMP "qa1-backup"

          if (!(Test-Path "IIS:\Sites\$site")) {
            throw "IIS site '$site' does not exist."
          }

          if (!(Test-Path "IIS:\AppPools\$pool")) {
            throw "IIS application pool '$pool' does not exist."
          }

          if (!(Test-Path $publish)) {
            throw "Validated publish directory was not found."
          }

          New-Item -ItemType Directory -Path $target -Force | Out-Null

          if (Test-Path $backup) {
            Remove-Item $backup -Recurse -Force
          }
          New-Item -ItemType Directory -Path $backup -Force | Out-Null

          $siteWasStarted = (Get-Website -Name $site).State -eq "Started"
          $poolWasStarted = (Get-WebAppPoolState -Name $pool).Value -eq "Started"
          $backupCreated = $false

          try {
            if ($siteWasStarted) {
              Stop-Website -Name $site
            }

            if ($poolWasStarted) {
              Stop-WebAppPool -Name $pool
            }

            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Seconds 1
              $poolState = (Get-WebAppPoolState -Name $pool).Value
            } while ($poolState -ne "Stopped" -and (Get-Date) -lt $deadline)

            if ($poolState -ne "Stopped") {
              throw "QA1 application pool did not stop within 30 seconds."
            }

            $existingFiles = @(Get-ChildItem $target -Force)
            if ($existingFiles.Count -gt 0) {
              Copy-Item "$target\*" $backup -Recurse -Force
              $backupCreated = $true
            }

            Get-ChildItem $target -Force |
              Remove-Item -Recurse -Force

            Copy-Item "$publish\*" $target -Recurse -Force

            Start-WebAppPool -Name $pool
            Start-Website -Name $site

            $healthy = $false

            for ($i = 1; $i -le 12; $i++) {
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://localhost:1111/" `
                  -UseBasicParsing `
                  -TimeoutSec 5

                if ($response.StatusCode -ge 200 -and
                    $response.StatusCode -lt 400) {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 5
              }
            }

            if (!$healthy) {
              throw "QA1 health check failed at http://localhost:1111/."
            }

            Write-Host "QA1 deployment and health check succeeded."
          }
          catch {
            $deploymentError = $_

            Write-Error "QA1 deployment failed. Attempting rollback."

            Stop-Website -Name $site -ErrorAction SilentlyContinue
            Stop-WebAppPool -Name $pool -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3

            Get-ChildItem $target -Force -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

            if ($backupCreated) {
              Copy-Item "$backup\*" $target -Recurse -Force
            }

            Start-WebAppPool -Name $pool
            Start-Website -Name $site

            throw $deploymentError
          }
