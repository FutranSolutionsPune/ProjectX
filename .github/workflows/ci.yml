
name: ProjectX CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: [self-hosted, Windows, X64, iis, dev]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate solution or project
        id: locate
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Filter *.sln -Recurse |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
            Select-Object -First 1

          if ($solution) {
            "project_path=$($solution.FullName)" >> $env:GITHUB_OUTPUT
            "project_dir=$($solution.DirectoryName)" >> $env:GITHUB_OUTPUT
          } else {
            $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
              Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
              Select-Object -First 1

            if (-not $project) {
              throw "No .sln or .csproj file found in the repository."
            }

            "project_path=$($project.FullName)" >> $env:GITHUB_OUTPUT
            "project_dir=$($project.DirectoryName)" >> $env:GITHUB_OUTPUT
          }

      - name: Restore dependencies
        run: dotnet restore "${{ steps.locate.outputs.project_path }}"

      - name: Build
        run: dotnet build "${{ steps.locate.outputs.project_path }}" --configuration Release --no-restore

      - name: Run tests when test projects exist
        shell: pwsh
        run: |
          $tests = Get-ChildItem -Path . -Filter *.csproj -Recurse |
            Where-Object {
              $_.FullName -notmatch '\\(bin|obj)\\' -and
              $_.Name -match 'Tests?\.csproj$'
            }

          foreach ($test in $tests) {
            dotnet test $test.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed: $($test.FullName)"
            }
          }

      - name: Publish web application
        run: dotnet publish "${{ steps.locate.outputs.project_path }}" --configuration Release --no-build --output "${{ runner.temp }}\publish"

      - name: Package deployment artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ runner.temp }}\publish\*" -DestinationPath "${{ runner.temp }}\ProjectX.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectX-${{ github.sha }}
          path: ${{ runner.temp }}\ProjectX.zip
          if-no-files-found: error
          retention-days: 14
