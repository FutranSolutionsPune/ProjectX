
name: ProjectX CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and Package
    runs-on: [self-hosted, Windows, X64, iis, dev]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate solution and web projects
        id: locate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $solutions = @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE `
              -Filter "*.sln" -Recurse -File |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]'
              }
          )

          $projects = @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE `
              -Filter "*.csproj" -Recurse -File |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]'
              }
          )

          Write-Host "Repository workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Solution files found: $($solutions.Count)"
          Write-Host "Project files found: $($projects.Count)"

          $solutions | ForEach-Object {
            Write-Host "Solution: $($_.FullName)"
          }

          $projects | ForEach-Object {
            Write-Host "Project: $($_.FullName)"
          }

          if ($projects.Count -eq 0) {
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Force |
              Select-Object Mode, Name |
              Format-Table -AutoSize

            throw "No .csproj files found in the checked-out repository. Check that the application source is committed to the branch being built."
          }

          $webProjects = @()

          foreach ($project in $projects) {
            [xml]$xml = Get-Content -LiteralPath $project.FullName -Raw

            $webSdk = $false

            foreach ($sdk in $xml.SelectNodes("//*[local-name()='Project']/@Sdk")) {
              if ($sdk.Value -eq "Microsoft.NET.Sdk.Web") {
                $webSdk = $true
              }
            }

            foreach ($sdk in $xml.SelectNodes("//*[local-name()='Sdk']/@Name")) {
              if ($sdk.Value -eq "Microsoft.NET.Sdk.Web") {
                $webSdk = $true
              }
            }

            if ($webSdk) {
              $webProjects += $project
            }
          }

          if ($webProjects.Count -eq 0) {
            throw "No ASP.NET Core web projects using Microsoft.NET.Sdk.Web were found."
          }

          Write-Host "ASP.NET Core web projects found: $($webProjects.Count)"

          foreach ($project in $webProjects) {
            Write-Host "Web project: $($project.FullName)"
          }

          "solution_count=$($solutions.Count)" >> $env:GITHUB_OUTPUT
          "web_count=$($webProjects.Count)" >> $env:GITHUB_OUTPUT

          $solutionPath = ""
          if ($solutions.Count -gt 0) {
            $solutionPath = $solutions[0].FullName
          }

          "solution_path=$solutionPath" >> $env:GITHUB_OUTPUT

          $webProjects |
            ForEach-Object { $_.FullName } |
            Set-Content -LiteralPath "$env:RUNNER_TEMP\web-projects.txt"

      - name: Restore dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solution = "${{ steps.locate.outputs.solution_path }}"

          if ($solution) {
            dotnet restore "$solution"
            if ($LASTEXITCODE -ne 0) {
              throw "Solution restore failed."
            }
          } else {
            Get-Content "$env:RUNNER_TEMP\web-projects.txt" |
              ForEach-Object {
                dotnet restore "$_"
                if ($LASTEXITCODE -ne 0) {
                  throw "Restore failed for $_"
                }
              }
          }

      - name: Build application
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $solution = "${{ steps.locate.outputs.solution_path }}"

          if ($solution) {
            dotnet build "$solution" --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) {
              throw "Solution build failed."
            }
          } else {
            Get-Content "$env:RUNNER_TEMP\web-projects.txt" |
              ForEach-Object {
                dotnet build "$_" --configuration Release --no-restore
                if ($LASTEXITCODE -ne 0) {
                  throw "Build failed for $_"
                }
              }
          }

      - name: Run automated tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tests = @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE `
              -Filter "*Tests.csproj" -Recurse -File |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]'
              }
          )

          $tests += @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE `
              -Filter "*Test.csproj" -Recurse -File |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]'
              }
          )

          $tests = @($tests | Sort-Object FullName -Unique)

          if ($tests.Count -eq 0) {
            Write-Host "No matching test projects found. Skipping tests."
          } else {
            foreach ($test in $tests) {
              Write-Host "Testing $($test.FullName)"
              dotnet test "$($test.FullName)" `
                --configuration Release

              if ($LASTEXITCODE -ne 0) {
                throw "Tests failed: $($test.FullName)"
              }
            }
          }

      - name: Publish web applications
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $publishRoot = Join-Path $env:RUNNER_TEMP "ProjectX-publish"

          if (Test-Path $publishRoot) {
            Remove-Item $publishRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $publishRoot -Force |
            Out-Null

          $projects = Get-Content "$env:RUNNER_TEMP\web-projects.txt"
          $index = 0

          foreach ($project in $projects) {
            $index++
            $projectName = [System.IO.Path]::GetFileNameWithoutExtension($project)
            $destination = Join-Path $publishRoot $projectName

            Write-Host "Publishing $project to $destination"

            dotnet publish "$project" `
              --configuration Release `
              --no-build `
              --output "$destination"

            if ($LASTEXITCODE -ne 0) {
              throw "Publish failed for $project"
            }
          }

          if (-not (Get-ChildItem $publishRoot -Recurse -File)) {
            throw "Publish output is empty."
          }

      - name: Create deployment ZIP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $publishRoot = Join-Path $env:RUNNER_TEMP "ProjectX-publish"
          $zipPath = Join-Path $env:RUNNER_TEMP "ProjectX.zip"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path "$publishRoot\*" `
            -DestinationPath $zipPath `
            -Force

          if (-not (Test-Path $zipPath)) {
            throw "ProjectX.zip was not created."
          }

          Write-Host "Created artifact: $zipPath"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectX-${{ github.sha }}
          path: ${{ runner.temp }}\ProjectX.zip
          if-no-files-found: error
          retention-days: 14
