
name: ProjectX CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "hotfix/**"
      - maintenance/**
    tags:
      - "qa1-*"
      - "qa2-*"

  pull_request:
    branches:
      - main
      - 'maintenance/**'

  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Test and Package
    runs-on: [self-hosted, Windows, X64, iis, dev]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Locate application project
        shell: powershell
        run: |
          $projects = @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.csproj -Recurse |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]' -and
                $_.Name -notmatch 'Tests?\.csproj$'
              }
          )

          if ($projects.Count -ne 1) {
            throw "Expected exactly one application .csproj; found $($projects.Count)."
          }

          "PROJECT_PATH=$($projects[0].FullName)" >> $env:GITHUB_ENV
          "PROJECT_NAME=$([System.IO.Path]::GetFileNameWithoutExtension($projects[0].Name))" >> $env:GITHUB_ENV

      - name: Restore
        shell: powershell
        run: dotnet restore "$env:PROJECT_PATH"

      - name: Build
        shell: powershell
        run: dotnet build "$env:PROJECT_PATH" --configuration Release --no-restore

      - name: Run tests
        shell: powershell
        run: |
          $tests = @(
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter *.csproj -Recurse |
              Where-Object {
                $_.FullName -notmatch '[\\/](bin|obj)[\\/]' -and
                $_.Name -match 'Tests?\.csproj$'
              }
          )

          if ($tests.Count -eq 0) {
            Write-Host "No test project found. Test execution skipped."
          } else {
            foreach ($test in $tests) {
              dotnet test "$($test.FullName)" --configuration Release
              if ($LASTEXITCODE -ne 0) {
                throw "Tests failed: $($test.Name)"
              }
            }
          }

      - name: Publish application
        shell: powershell
        run: |
          $publish = Join-Path $env:RUNNER_TEMP "ProjectX-publish"

          if (Test-Path $publish) {
            Remove-Item $publish -Recurse -Force
          }

          dotnet publish "$env:PROJECT_PATH" `
            --configuration Release `
            --no-build `
            --output $publish

          if ($LASTEXITCODE -ne 0) {
            throw "Application publish failed."
          }

          if (!(Test-Path (Join-Path $publish "web.config"))) {
            throw "Publish output is missing web.config."
          }

          if (!(Test-Path (Join-Path $publish "$env:PROJECT_NAME.dll"))) {
            throw "Publish output is missing $env:PROJECT_NAME.dll."
          }

          "PUBLISH_DIR=$publish" >> $env:GITHUB_ENV

      - name: Create deployment package
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ProjectX.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$env:PUBLISH_DIR\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (!(Test-Path $zip)) {
            throw "Deployment package was not created."
          }

          "ARTIFACT_NAME=ProjectX-${{ github.sha }}" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectX-${{ github.sha }}
          path: ${{ runner.temp }}\ProjectX.zip
          if-no-files-found: error
          retention-days: 14

  # MAIN: automatically deploy the build to DEV.
  deploy-dev:
    name: ProjectX DEV CD
    needs: build
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/maintenance/')
      )
    uses: ./.github/workflows/dev-cd.yml
    permissions:
      actions: read
      contents: read

  # QA1: a pushed qa1-* tag triggers CI, then QA1 CD.
  deploy-qa1:
    name: ProjectX QA1 CD
    needs: build
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/qa1-')
    uses: ./.github/workflows/qa1-cd.yml
    permissions:
      actions: read
      contents: read

  # QA2: a pushed qa2-* tag triggers CI, then QA2 CD.
  deploy-qa2:
    name: ProjectX QA2 CD
    needs: build
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/qa2-')
    uses: ./.github/workflows/qa2-cd.yml
    permissions:
      actions: read
      contents: read

  # Either successful QA deployment can proceed to shared Staging.
  deploy-staging:
    name: ProjectX Staging CD
    needs:
      - deploy-qa1
      - deploy-qa2
    if: >-
      always() &&
      (
        needs.deploy-qa1.result == 'success' ||
        needs.deploy-qa2.result == 'success'
      )
    uses: ./.github/workflows/staging-cd.yml
    permissions:
      actions: read
      contents: read
