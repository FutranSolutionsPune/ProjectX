
name: ProjectX Production Deployment

on:
  workflow_run:
    workflows: ["ProjectX CI"]
    types: [completed]
    branches:
      - "release/**"

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify Staging Artifact
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64, iis, prod]

    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      release_branch: ${{ steps.meta.outputs.release_branch }}
      ci_run_id: ${{ steps.meta.outputs.ci_run_id }}

    steps:
      - name: Capture CI metadata
        id: meta
        shell: powershell
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RELEASE_BRANCH -notmatch '^release/.+') {
            throw "Not a release branch."
          }

          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Invalid commit SHA."
          }

          "source_sha=$env:SOURCE_SHA" >> $env:GITHUB_OUTPUT
          "release_branch=$env:RELEASE_BRANCH" >> $env:GITHUB_OUTPUT
          "ci_run_id=$env:CI_RUN_ID" >> $env:GITHUB_OUTPUT

      - name: Download Staging success record
        uses: actions/download-artifact@v4
        with:
          name: ProjectX-Staging-Passed-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}\StagingRecord
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify Staging record
        shell: powershell
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          $ErrorActionPreference = "Stop"
          $path = Join-Path $env:RUNNER_TEMP "StagingRecord\staging-passed.json"

          if (!(Test-Path $path)) {
            throw "Staging success record missing."
          }

          $record = Get-Content $path -Raw | ConvertFrom-Json

          if ($record.result -ne "success" -or
              $record.environment -ne "Staging" -or
              "$($record.ci_run_id)" -ne $env:CI_RUN_ID -or
              $record.source_sha -ne $env:SOURCE_SHA -or
              $record.source_ref -ne "refs/heads/$env:RELEASE_BRANCH") {
            throw "Staging record does not match this CI run, branch and commit."
          }

          Write-Host "Staging record verified."

      - name: Download exact CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ProjectX-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}\ProdPackage
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Validate package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "ProdPackage\ProjectX.zip"

          if (!(Test-Path $zip)) {
            throw "ProjectX.zip missing."
          }

          $extract = Join-Path $env:RUNNER_TEMP "ProdVerify"
          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          Expand-Archive -Path $zip -DestinationPath $extract -Force

          if (!(Test-Path (Join-Path $extract "web.config"))) {
            throw "web.config missing from package."
          }

          if (@(Get-ChildItem $extract -Filter "*.dll" -File).Count -eq 0) {
            throw "No DLL files found."
          }

          Write-Host "Production package validated."

  deploy:
    name: Production Approval and Deployment
    needs: verify
    runs-on: [self-hosted, Windows, X64, iis, prod]
    environment: Production

    steps:
      - name: Download verified CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ProjectX-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}\ProdPackage
          run-id: ${{ needs.verify.outputs.ci_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}


      - name: Deploy to Production IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module WebAdministration

          $site = "MyProject-PROD"
          $target = "C:\inetpub\wwwroot\MyProject-PROD"
          $zip = Join-Path $env:RUNNER_TEMP "ProdPackage\ProjectX.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ProdDeploy"
          $backup = "C:\inetpub\wwwroot\MyProject-PROD-backup-${{ github.run_id }}"

          if (!(Test-Path $zip)) {
            throw "Deployment package missing."
          }

          if (!(Test-Path (Join-Path $target "web.config"))) {
            throw "Existing Production site not found; refusing first-time overwrite."
          }

          $siteInfo = Get-Website -Name $site -ErrorAction Stop
          $appPool = $siteInfo.applicationPool

          if ([string]::IsNullOrWhiteSpace($appPool)) {
            throw "Could not determine the IIS application pool for $site."
          }

          Write-Host "IIS site: $site"
          Write-Host "Application pool: $appPool"

          # Prepare and validate the new package before touching Production.
          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          Expand-Archive -Path $zip -DestinationPath $extract -Force

          if (!(Test-Path (Join-Path $extract "web.config"))) {
            throw "Package is missing web.config."
          }

          if (@(Get-ChildItem $extract -Filter "*.dll" -File).Count -eq 0) {
            throw "Package contains no DLL files."
          }

          # Back up the current deployment before stopping IIS.
          New-Item -ItemType Directory -Path $backup -Force | Out-Null
          Copy-Item "$target\*" $backup -Recurse -Force

          $deploymentStarted = $false

          try {
            $deploymentStarted = $true

            Stop-WebSite -Name $site

            if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
              Stop-WebAppPool -Name $appPool
            }

            # Wait for the application pool worker to release the DLL.
            $dll = Join-Path $target "ProjectX.dll"
            $deadline = (Get-Date).AddSeconds(30)
            $unlocked = $false

            do {
              try {
                $stream = [System.IO.File]::Open(
                  $dll,
                  [System.IO.FileMode]::Open,
                  [System.IO.FileAccess]::ReadWrite,
                  [System.IO.FileShare]::None
                )
                $stream.Dispose()
                $unlocked = $true
              }
              catch {
                Start-Sleep -Seconds 2
              }
            } while (!$unlocked -and (Get-Date) -lt $deadline)

            if (!$unlocked) {
              throw "ProjectX.dll remains locked after stopping the application pool."
            }

            Get-ChildItem $target -Force |
              Remove-Item -Recurse -Force

            Copy-Item "$extract\*" $target -Recurse -Force

            Start-WebAppPool -Name $appPool
            Start-WebSite -Name $site

            Start-Sleep -Seconds 5

            $response = Invoke-WebRequest `
              -Uri "http://localhost/" `
              -UseBasicParsing `
              -TimeoutSec 20

            if ($response.StatusCode -lt 200 -or
                $response.StatusCode -ge 400) {
              throw "Production health check returned HTTP $($response.StatusCode)."
            }

            Write-Host "Production deployment and health check succeeded."
          }
          catch {
            $originalError = $_
            Write-Host "DEPLOYMENT ERROR: $($originalError.Exception.Message)"
            Write-Host ($originalError | Out-String)

            if ($deploymentStarted) {
              Write-Host "Attempting rollback from: $backup"

              try {
                Stop-WebSite -Name $site -ErrorAction SilentlyContinue
                Stop-WebAppPool -Name $appPool -ErrorAction SilentlyContinue

                $deadline = (Get-Date).AddSeconds(30)
                do {
                  Start-Sleep -Seconds 2
                  $worker = Get-WebAppPoolState -Name $appPool
                } while ($worker.Value -ne "Stopped" -and (Get-Date) -lt $deadline)

                if ($worker.Value -ne "Stopped") {
                  throw "Application pool did not stop; cannot safely restore files."
                }

                Get-ChildItem $target -Force |
                  Remove-Item -Recurse -Force

                Copy-Item "$backup\*" $target -Recurse -Force

                Start-WebAppPool -Name $appPool
                Start-WebSite -Name $site

                Write-Host "Rollback completed."
              }
              catch {
                Write-Host "ROLLBACK ERROR: $($_.Exception.Message)"
                throw "Deployment failed and rollback also failed. Preserve backup at $backup. Original error: $($originalError.Exception.Message)"
              }
            }

            throw $originalError
          }
