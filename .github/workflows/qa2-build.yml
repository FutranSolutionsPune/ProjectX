name: QA2 Build

on:
  push:
    tags:
      - 'qa2-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build QA2
    runs-on: windows-latest

    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is from main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor \
            "$GITHUB_SHA" origin/main; then
            echo "Error: Tag must point to a commit in main."
            exit 1
          fi

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore ./YourSolution.sln

      - name: Build QA2
        shell: pwsh
        run: |
          msbuild ./YourSolution.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /m

      - name: Upload QA2 build
        uses: actions/upload-artifact@v4
        with:
          name: QA2-${{ github.ref_name }}
          path: |
            **/bin/Release/**
          if-no-files-found: error
          retention-days: 14
