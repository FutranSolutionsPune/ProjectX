
name: ProjectX Production Verification

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI run ID that produced the Staging-tested artifact"
        required: true
        type: string
      release_branch:
        description: "Release branch tested in Staging"
        required: true
        type: string
      source_sha:
        description: "Full commit SHA tested in Staging"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify Staging Artifact
    runs-on: [self-hosted, Windows, X64, iis, prod]

    steps:
      - name: Validate inputs
        shell: powershell
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:CI_RUN_ID -notmatch '^\d+$') {
            throw "CI run ID must be numeric."
          }

          if ($env:RELEASE_BRANCH -notmatch '^release/.+') {
            throw "Expected a release/* branch."
          }

          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Source SHA must be a full 40-character commit SHA."
          }

          Write-Host "Inputs validated."

      - name: Download Staging success record
        uses: actions/download-artifact@v4
        with:
          name: ProjectX-Staging-Passed-${{ inputs.source_sha }}
          path: ${{ runner.temp }}\ProjectX-Staging-Record
          run-id: ${{ inputs.ci_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify Staging success record
        shell: powershell
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $recordPath = Join-Path $env:RUNNER_TEMP "ProjectX-Staging-Record\staging-passed.json"

          if (!(Test-Path $recordPath)) {
            throw "Staging success record was not found."
          }

          $record = Get-Content $recordPath -Raw | ConvertFrom-Json

          if ($record.result -ne "success") {
            throw "Staging record does not indicate success."
          }

          if ($record.environment -ne "Staging") {
            throw "Record is not for Staging."
          }

          if ("$($record.ci_run_id)" -ne $env:CI_RUN_ID) {
            throw "Staging record belongs to a different CI run."
          }

          if ($record.source_sha -ne $env:SOURCE_SHA) {
            throw "Staging-tested SHA does not match."
          }

          if ($record.source_ref -ne "refs/heads/$env:RELEASE_BRANCH") {
            throw "Staging-tested branch does not match."
          }

          Write-Host "Staging record verified."

      - name: Download exact CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ProjectX-${{ inputs.source_sha }}
          path: ${{ runner.temp }}\ProjectX-Prod-Package
          run-id: ${{ inputs.ci_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Validate package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path $env:RUNNER_TEMP "ProjectX-Prod-Package\ProjectX.zip"

          if (!(Test-Path $zip)) {
            throw "ProjectX.zip was not found."
          }

          $extract = Join-Path $env:RUNNER_TEMP "ProjectX-Prod-Verify"

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          if (!(Test-Path (Join-Path $extract "web.config"))) {
            throw "Package is missing web.config."
          }

          $dlls = @(Get-ChildItem -Path $extract -Filter "*.dll" -File)

          if ($dlls.Count -eq 0) {
            throw "Package contains no DLL files."
          }

          Write-Host "Artifact validation succeeded."
          Write-Host "Verification only: Production was not changed."
