name: ProjectX CD — Production Deployment

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "CI run ID that produced the artifact tested in Staging"
        required: true
        type: string
      release_branch:
        description: "Release branch tested in Staging (e.g. release/2026.21)"
        required: true
        type: string
      source_sha:
        description: "Exact commit SHA whose artifact passed Staging"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: projectx-production-deployment
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy Approved Artifact to Production
    runs-on: [self-hosted, Windows, X64, iis, prod]

    environment:
      name: Production

    steps:
      - name: Validate deployment inputs
        shell: powershell
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:CI_RUN_ID -notmatch '^\d+$') {
            throw "CI run ID must be numeric."
          }

          if ($env:RELEASE_BRANCH -notmatch '^release/.+') {
            throw "Expected a release/* branch."
          }

          if ($env:SOURCE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Source SHA must be a full 40-character commit SHA."
          }

          Write-Host "Release branch: $env:RELEASE_BRANCH"
          Write-Host "Source commit: $env:SOURCE_SHA"
          Write-Host "Original CI run: $env:CI_RUN_ID"


      - name: Download Staging success record
        uses: actions/download-artifact@v4
        with:
          name: ProjectX-Staging-Passed-${{ inputs.source_sha }}
          path: ${{ runner.temp }}\ProjectX-Staging-Record
          run-id: ${{ inputs.ci_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify Staging record
        shell: powershell
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference = "Stop"

          $recordPath = Join-Path `
            $env:RUNNER_TEMP `
            "ProjectX-Staging-Record\staging-passed.json"

          if (!(Test-Path $recordPath)) {
            throw "Staging success record was not found."
          }

          $record = Get-Content $recordPath -Raw | ConvertFrom-Json

          if ($record.result -ne "success") {
            throw "The Staging record does not indicate success."
          }

          if ($record.environment -ne "Staging") {
            throw "The record is not for Staging."
          }

          if ($record.ci_run_id -ne $env:CI_RUN_ID) {
            throw "The Staging record belongs to a different CI run."
          }

          if ($record.source_sha -ne $env:SOURCE_SHA) {
            throw "The Staging-tested SHA does not match the requested SHA."
          }

          if ($record.source_ref -ne "refs/heads/$env:RELEASE_BRANCH") {
            throw "The Staging-tested branch does not match the release branch."
          }

          Write-Host "Staging verification passed."
          Write-Host "Verified branch: $($record.source_ref)"
          Write-Host "Verified commit: $($record.source_sha)"


      - name: Download exact CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ProjectX-${{ inputs.source_sha }}
          path: ${{ runner.temp }}\ProjectX-Prod-Package
          run-id: ${{ inputs.ci_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Validate and extract package
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $packageRoot = Join-Path $env:RUNNER_TEMP "ProjectX-Prod-Package"
          $zip = Join-Path $packageRoot "ProjectX.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ProjectX-Prod-Extract"

          if (!(Test-Path $zip)) {
            throw "ProjectX.zip was not found in the downloaded CI artifact."
          }

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          if (!(Test-Path (Join-Path $extract "web.config"))) {
            throw "Package is missing web.config."
          }

          $dlls = @(Get-ChildItem -Path $extract -Filter "*.dll" -File)
          if ($dlls.Count -eq 0) {
            throw "Package contains no DLL files."
          }

          "extract=$extract" >> $env:GITHUB_OUTPUT

      - name: Deploy to Production with recovery
        shell: powershell
        env:
          EXTRACT_PATH: ${{ steps.package.outputs.extract }}
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module WebAdministration

          $site = "MyProject-PROD"
          $pool = "MyProject-PROD"
          $target = "C:\inetpub\wwwroot\MyProject-PROD"
          $backupRoot = "C:\inetpub\wwwroot\ProjectX-Production-Backups"
          $backup = Join-Path $backupRoot (Get-Date -Format "yyyyMMdd-HHmmss")

          if (!(Test-Path "IIS:\Sites\$site")) {
            throw "Production IIS site '$site' was not found."
          }

          if (!(Test-Path "IIS:\AppPools\$pool")) {
            throw "Production app pool '$pool' was not found."
          }

          if (!(Test-Path $target)) {
            throw "Production deployment directory '$target' was not found."
          }

          New-Item -ItemType Directory -Path $backupRoot -Force | Out-Null

          $existingFiles = @(Get-ChildItem -Path $target -Force)
          $hadPreviousFiles = $existingFiles.Count -gt 0
          $backupReady = $false
          $poolWasStarted = (Get-WebAppPoolState -Name $pool).Value -eq "Started"

          try {
            if ($hadPreviousFiles) {
              New-Item -ItemType Directory -Path $backup -Force | Out-Null
              Copy-Item "$target\*" $backup -Recurse -Force
              $backupReady = $true
              Write-Host "Previous deployment backed up to $backup"
            }

            if ($poolWasStarted) {
              Stop-WebAppPool -Name $pool
            }

            Start-Sleep -Seconds 3

            Get-ChildItem -Path $target -Force |
              Remove-Item -Recurse -Force

            Copy-Item "$env:EXTRACT_PATH\*" $target -Recurse -Force

            Start-WebAppPool -Name $pool
            Start-Website -Name $site

            $healthy = $false

            for ($i = 1; $i -le 12; $i++) {
              Start-Sleep -Seconds 5

              try {
                $response = Invoke-WebRequest `
                  -Uri "http://localhost/" `
                  -UseBasicParsing `
                  -TimeoutSec 10

                if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 400) {
                  $healthy = $true
                  Write-Host "Production health check returned HTTP $($response.StatusCode)."
                  break
                }
              }
              catch {
                Write-Host "Health check attempt $i failed: $($_.Exception.Message)"
              }
            }

            if (!$healthy) {
              throw "Production health check failed."
            }

            Write-Host "Production deployment succeeded."
            Write-Host "Deployed source SHA: ${{ inputs.source_sha }}"
          }
          catch {
            $deploymentError = $_.Exception.Message
            Write-Host "Deployment failed: $deploymentError"
            Write-Host "Attempting to restore the previous deployment."

            try {
              if ((Get-WebAppPoolState -Name $pool).Value -eq "Started") {
                Stop-WebAppPool -Name $pool
              }

              Start-Sleep -Seconds 3

              Get-ChildItem -Path $target -Force |
                Remove-Item -Recurse -Force

              if ($backupReady) {
                Copy-Item "$backup\*" $target -Recurse -Force
                Write-Host "Previous deployment files restored."
              }
              elseif (!$hadPreviousFiles) {
                Write-Host "There were no previous deployment files to restore."
              }
              else {
                throw "Backup was not completed; automatic recovery cannot be guaranteed."
              }

              Start-WebAppPool -Name $pool
              Start-Website -Name $site

              if ($backupReady) {
                $recovered = $false

                for ($i = 1; $i -le 6; $i++) {
                  Start-Sleep -Seconds 5
                  try {
                    $response = Invoke-WebRequest `
                      -Uri "http://localhost/" `
                      -UseBasicParsing `
                      -TimeoutSec 10

                    if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 400) {
                      $recovered = $true
                      Write-Host "Previous deployment health check passed."
                      break
                    }
                  }
                  catch {
                    Write-Host "Recovery health check attempt $i failed."
                  }
                }

                if (!$recovered) {
                  throw "Previous files were restored, but the recovery health check failed."
                }
              }
            }
            catch {
              Write-Host "RECOVERY ERROR: $($_.Exception.Message)"
            }

            throw "Production deployment failed: $deploymentError"
          }
