
name: ProjectX DEV CD

on:
  workflow_run:
    workflows: ["ProjectX CI"]
    types: [completed]
    branches: [develop]

permissions:
  actions: read
  contents: read

concurrency:
  group: projectx-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DEV IIS
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'

    runs-on: [self-hosted, Windows, X64, iis, dev]

    steps:
      - name: Download artifact from triggering CI run
        uses: actions/download-artifact@v4
        with:
          name: ProjectX-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}\ProjectX-artifact
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployment package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Join-Path $env:RUNNER_TEMP "ProjectX-artifact\ProjectX.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ProjectX-extracted"

          if (-not (Test-Path $zip)) {
            throw "ProjectX.zip was not found in the CI artifact."
          }

          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }

          New-Item -ItemType Directory -Path $extract | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

          $webConfig = Join-Path $extract "web.config"
          if (-not (Test-Path $webConfig)) {
            throw "web.config is missing from the publish root."
          }

          $config = [xml](Get-Content -LiteralPath $webConfig -Raw)
          $aspNetCore = $config.SelectSingleNode("//aspNetCore")

          if (-not $aspNetCore) {
            throw "web.config has no aspNetCore handler configuration."
          }

          $dllName = [System.IO.Path]::GetFileName($aspNetCore.GetAttribute("processPath"))
          if ($aspNetCore.GetAttribute("arguments") -match '\.dll') {
            $match = [regex]::Match($aspNetCore.GetAttribute("arguments"), '[^"]+\.dll')
            if ($match.Success) {
              $dllName = [System.IO.Path]::GetFileName($match.Value)
            }
          }

          if (-not $dllName -or -not (Test-Path (Join-Path $extract $dllName))) {
            throw "Application DLL referenced by web.config was not found."
          }

          "DEPLOY_SOURCE=$extract" >> $env:GITHUB_ENV
          Write-Host "Validated published application: $dllName"

      - name: Deploy to ProjectX DEV IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module WebAdministration

          $siteName = "ProjectX-DEV"
          $poolName = "ProjectX-DEV"
          $destination = "C:\inetpub\wwwroot\ProjectX"
          $source = $env:DEPLOY_SOURCE

          $site = Get-Website -Name $siteName -ErrorAction SilentlyContinue
          if (-not $site) { throw "IIS site $siteName was not found." }

          if (-not (Test-Path $destination)) {
            throw "IIS destination does not exist: $destination"
          }

          if (-not (Test-Path (Join-Path $source "web.config"))) {
            throw "Publish output is invalid."
          }

          $backup = Join-Path $env:RUNNER_TEMP "ProjectX-backup"
          if (Test-Path $backup) {
            Remove-Item $backup -Recurse -Force
          }
          New-Item -ItemType Directory -Path $backup | Out-Null

          # Preserve the currently deployed files.
          Copy-Item (Join-Path $destination "*") $backup `
            -Recurse -Force -ErrorAction SilentlyContinue

          try {
            Stop-Website -Name $siteName
            Stop-WebAppPool -Name $poolName

            Get-ChildItem -LiteralPath $destination -Force |
              Remove-Item -Recurse -Force

            Copy-Item (Join-Path $source "*") $destination -Recurse -Force

            Start-WebAppPool -Name $poolName
            Start-Website -Name $siteName
          }
          catch {
            Write-Error "Deployment failed: $($_.Exception.Message)"
            throw
          }

      - name: Verify DEV endpoint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "http://localhost:8085/"
          $healthy = $false

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $url `
                -UseBasicParsing -TimeoutSec 10

              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 400) {
                Write-Host "DEV health check passed: HTTP $($response.StatusCode)"
                $healthy = $true
                break
              }
            }
            catch {
              Write-Host "Attempt $attempt failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $healthy) {
            throw "DEV endpoint did not return a healthy HTTP response."
          }
