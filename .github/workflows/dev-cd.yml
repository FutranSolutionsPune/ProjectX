
name: ProjectX DEV CD

on:
  workflow_call:

permissions:
  actions: read
  contents: read

concurrency:
  group: projectx-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy artifact to DEV IIS
    runs-on: [self-hosted, Windows, X64, iis, dev]

    steps:
      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ProjectX-${{ github.sha }}
          path: ${{ runner.temp }}\ProjectX-artifact

      - name: Validate deployment package
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ProjectX-artifact\ProjectX.zip"
          if (!(Test-Path $zip)) {
            throw "Deployment package not found: $zip"
          }

          $extract = Join-Path $env:RUNNER_TEMP "ProjectX-deploy"
          if (Test-Path $extract) {
            Remove-Item $extract -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extract | Out-Null
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          [xml]$config = Get-Content (Join-Path $extract "web.config")
          $dll = $config.configuration.'system.webServer'.aspNetCore.GetAttribute("arguments")

          if (!$dll -or $dll -notmatch '\.dll') {
            throw "Could not determine the application DLL from web.config."
          }

          $dllName = [regex]::Match($dll, '[^" ]+\.dll').Value
          if (!$dllName -or !(Test-Path (Join-Path $extract $dllName))) {
            throw "Application DLL referenced by web.config was not found."
          }

          "DEPLOY_SOURCE=$extract" >> $env:GITHUB_ENV

      - name: Deploy with rollback protection
        shell: pwsh
        run: |
          Import-Module WebAdministration -ErrorAction Stop

          $site = "ProjectX-DEV"
          $pool = "ProjectX-DEV"
          $destination = "C:\inetpub\wwwroot\ProjectX"
          $backup = Join-Path $env:RUNNER_TEMP ("ProjectX-backup-" + $env:GITHUB_RUN_ID)
          $source = $env:DEPLOY_SOURCE

          if (!(Test-Path "IIS:\Sites\$site")) {
            throw "IIS site '$site' does not exist."
          }
          if (!(Test-Path $source)) {
            throw "Deployment source does not exist."
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          New-Item -ItemType Directory -Path $backup -Force | Out-Null

          $hadPreviousFiles = @(Get-ChildItem $destination -Force).Count -gt 0
          if ($hadPreviousFiles) {
            Copy-Item "$destination\*" $backup -Recurse -Force
          }

          try {
            Stop-WebSite -Name $site
            Stop-WebAppPool -Name $pool

            Get-ChildItem $destination -Force |
              Remove-Item -Recurse -Force

            Copy-Item "$source\*" $destination -Recurse -Force

            Start-WebAppPool -Name $pool
            Start-WebSite -Name $site

            Write-Host "Deployment files copied successfully."
          }
          catch {
            Write-Error "Deployment failed. Attempting rollback: $_"

            try {
              if ((Get-WebAppPoolState -Name $pool).Value -ne "Stopped") {
                Stop-WebAppPool -Name $pool
              }
              if ((Get-WebSite -Name $site).State -ne "Stopped") {
                Stop-WebSite -Name $site
              }

              Get-ChildItem $destination -Force |
                Remove-Item -Recurse -Force

              if ($hadPreviousFiles) {
                Copy-Item "$backup\*" $destination -Recurse -Force
              }

              Start-WebAppPool -Name $pool
              Start-WebSite -Name $site
              Write-Host "Rollback file restoration completed."
            }
            catch {
              Write-Error "CRITICAL: Automatic rollback failed: $_"
            }

            throw "Deployment failed; review logs and verify the IIS site."
          }

      - name: Verify DEV health
        shell: pwsh
        run: |
          $url = "http://localhost:8085/"
          $healthy = $false

          for ($i = 1; $i -le 12; $i++) {
            try {
              $response = Invoke-WebRequest `
                -Uri $url `
                -UseBasicParsing `
                -TimeoutSec 10

              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 400) {
                $healthy = $true
                break
              }
            }
            catch {
              Write-Host "Health check attempt $i failed: $_"
            }

            Start-Sleep -Seconds 5
          }

          if (!$healthy) {
            throw "DEV health check failed at $url."
          }

          Write-Host "DEV health check passed."
